name: WebHare CI

on:
  workflow_dispatch:
    inputs:
      WEBHARE_WEBSERVER:
        description: 'Webserver override (for example nginxjs)'
        type: string
        default: ''
  # This workflow is used by external-pr.yml to ensure we stay in the same PR context. Using workflow_dispatch didn't add 'checks' to the PR
  # It's also invoked by internal-pr.yml on push events so that the success test is always named 'WebHare CI / all-tests-passed'
  workflow_call:
    secrets:
      cache_registry:
        description: 'Cache Registry URL'
      cache_user:
        description: 'Cache user'
      cache_password:
        description: 'Cache password'
      TESTSECRET_SECRETSURL:
        description: 'Test secret service URL'
        required: false
      DOCKERHUB_REGISTRY_PASSWORD:
        description: 'Docker Hub registry password'
        required: false
      WHBUILD_BUILDBOTPASSWORD:
        description: 'Build bot password for deploying test scripts'
        required: false
    inputs:
      ref: # This will point to the actual PR commit
        type: string
        description: 'Git ref to build'
      ref_name:
        type: string
        description: 'Branch name for scheduled CI runs'
      scheduled:
        type: boolean
        description: Skip deployment steps for scheduled CI runs
        default: false
      WEBHARE_WEBSERVER:
        type: string
        description: 'Webserver override (for example nginxjs)'
        default: ''

env:
  TESTFW_WEBHARE_WEBSERVER: ${{ inputs.WEBHARE_WEBSERVER || '' }}
  CI_COMMIT_SHA: ${{ inputs.ref || github.sha }}
  # Branch name. Used also to detect if we're on the main branch and need to autotag a release/x.y container too
  # Forks setting this to 'main' shouldn't be a risk as deployment will not run unless github.event_name == 'push' (TODO but still cleaner to not set it at all?)
  CI_COMMIT_REF_NAME: "${{ inputs.ref_name || github.ref_name }}" # Extract ref name (e.g. main or feature/my-branch).
  CI_PIPELINE_ID: "${{ github.run_id }}"
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKERHUB_REGISTRY_USER: ${{ vars.DOCKERHUB_REGISTRY_USER }}

permissions:
  contents: read
  packages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency: # cancel older workflows when a new push is done on a branch. but workflow_dispatch run shouldn't conflict with normal jobs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref_name || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Calculate release tag
    outputs:
      CI_COMMIT_REF_SLUG: ${{ steps.slug.outputs.CI_COMMIT_REF_SLUG }}
      PUBLIC_REGISTRY_IMAGE: ${{ steps.slug.outputs.PUBLIC_REGISTRY_IMAGE }}
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - id: slug
        env:
          PUBLIC_REGISTRY_IMAGE_CONFIG: ${{ vars.PUBLIC_REGISTRY_IMAGE }}
        run: |
          # Lowercase, replace non-alphanumeric chars with '-', trim trailing dashes, cut to 63 chars
          SLUG=$(echo "$CI_COMMIT_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-63)
          echo "CI_COMMIT_REF_SLUG=$SLUG" >> "$GITHUB_OUTPUT"

          # Setting PUBLIC_REGISTRY_IMAGE triggers pushes to docker.io, which we don't want to do for non release branches (ie feature/ or custom/) - they stay on ghcr.io
          if [[ "$CI_COMMIT_REF_NAME" == "main" || "$CI_COMMIT_REF_NAME" == release/* ]]; then
            echo "PUBLIC_REGISTRY_IMAGE=$PUBLIC_REGISTRY_IMAGE_CONFIG" >> "$GITHUB_OUTPUT"
          else
            echo "PUBLIC_REGISTRY_IMAGE=" >> "$GITHUB_OUTPUT"
          fi

  buildcontainer:
    needs: [prepare]
    name: Build container
    # See https://github.com/actions/runner-images. Fork PRs (via pull-request.yml) never get our own runners
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    env:
      CI_COMMIT_REF_SLUG: ${{ needs.prepare.outputs.CI_COMMIT_REF_SLUG }}
      PUBLIC_REGISTRY_IMAGE: ${{ needs.prepare.outputs.PUBLIC_REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          allow-unsafe-pr-checkout: true # Needed to be able to pull for Fork PRs
          submodules: recursive
      - uses: ./.github/actions/checkout-and-login
        with:
          ref: ${{ inputs.ref || github.sha }}
          registry: ${{ secrets.cache_registry }}
          username: ${{ secrets.cache_user }}
          password: ${{ secrets.cache_password }}
      - name: Build and push WebHare container
        env:
          PUSH_BUILD_IMAGES: "1"
          WHBUILD_RUNNER: "${{ runner.name }}"
        run: whtree/bin/wh buildcontainer --podman
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: buildcontainer-artifacts${{ inputs.scheduled && format('-{0}', needs.prepare.outputs.CI_COMMIT_REF_SLUG) || '' }}
          path: artifacts/
          if-no-files-found: ignore

  test-vscode-extension:
    name: VS Code extension tests
    needs: [prepare]
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - run: addons/vscode-extension/scripts/run-extension-tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-extension-artifacts${{ inputs.scheduled && format('-{0}', needs.prepare.outputs.CI_COMMIT_REF_SLUG) || '' }}
          path: artifacts/
          if-no-files-found: ignore

  testcontainers:
    name: ${{ matrix.name }}
    needs: [prepare,buildcontainer]
    if: needs.buildcontainer.result == 'success'
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    continue-on-error: ${{ matrix.allow_failure }}
    env:
      CI_COMMIT_REF_SLUG: ${{ needs.prepare.outputs.CI_COMMIT_REF_SLUG }}
      TESTSECRET_SECRETSURL: ${{ secrets.TESTSECRET_SECRETSURL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: baselibs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external baselibs', allow_failure: false }
          - { name: modules, command: 'addons/docker-build/testcontainer.sh --podman --tag=-external checkmodules', allow_failure: false }
            #We need --noautomoduledir to prevent testmodule just using CI_PROJECT_DIR (which takes precedence over $1)
            #We need --webhareimage because --module makes webhareimage default to 'main'
          - { name: devkit, command: 'TESTFW_WEBHARE_ENABLE_DEVKIT=1 addons/docker-build/testcontainer.sh --podman --noautomoduledir --webhareimage "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" --module "$(pwd)/whtree/modules/devkit"', allow_failure: false }
          - { name: publisher, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-forms publisher,socialite', allow_failure: false }
          - { name: publisher-forms, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=forms publisher', allow_failure: false }
          - { name: system, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-nodejs system', allow_failure: false }
          - { name: system-nodejs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,nodejs system', allow_failure: false }
          - { name: webdesign, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external publisher-webdesign', allow_failure: false }
          - { name: database, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.database', allow_failure: false }
          - { name: tollium, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external tollium', allow_failure: false }
          - { name: consilio, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external consilio', allow_failure: false }
          - { name: core, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external --generatexmltests wh.hscore', allow_failure: false }
          - { name: webserver, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.webserver', allow_failure: false }
          - { name: wrd, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-wrd-legacy,-wrd-nodejs wrd', allow_failure: false }
          - { name: wrd-legacy, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,wrd-legacy wrd', allow_failure: false }
          - { name: wrd-nodejs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,wrd-nodejs wrd', allow_failure: false }
          - { name: jscomponents, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.jscomponents', allow_failure: false }
          - { name: external, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=external', allow_failure: true }
          - { name: two-hares, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --twohares --testscript $PWD/whtree/modules/webhare_testsuite/scripts/whcommands/twoharetests.sh', allow_failure: false }
          - { name: backup-restore, command: 'TESTFW_SKIP_FINALIZE_CI=1 addons/docker-build/testcontainer.sh --podman --nocheckmodule --testscript $PWD/whtree/modules/webhare_testsuite/scripts/whcommands/backup-restore-test.sh', allow_failure: false }
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          allow-unsafe-pr-checkout: true # Needed to be able to pull for Fork PRs
          submodules: recursive
      - uses: ./.github/actions/checkout-and-login
        with:
          ref: ${{ inputs.ref || github.sha }}
          registry: ${{ secrets.cache_registry || vars.CI_REGISTRY_IMAGE }}
          username: ${{ secrets.cache_user }}
          password: ${{ secrets.cache_password }}
      - name: Run test container
        run: BUILD_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-${{ matrix.name }}-artifacts${{ inputs.scheduled && format('-{0}', needs.prepare.outputs.CI_COMMIT_REF_SLUG) || '' }}
          path: artifacts/
          if-no-files-found: ignore

  # we need this step for our GitHub approval settings to have some clear check they can require
  all-tests-passed:
    needs: [buildcontainer, test-vscode-extension, testcontainers]
    # The gate must run even when a dependency fails so the required check reports failure rather than skipped.
    if: always()
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - name: Verify all tests passed
        if: >-
          needs.buildcontainer.result != 'success' ||
          needs.test-vscode-extension.result != 'success' ||
          needs.testcontainers.result != 'success'
        run: exit 1
      - run: echo "All tests passed successfully."

  deploy:
    name: Deploy container
    needs: [prepare, all-tests-passed]
    if: github.event_name == 'push' && !inputs.scheduled
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    env:
      CI_COMMIT_REF_SLUG: ${{ needs.prepare.outputs.CI_COMMIT_REF_SLUG }}
      DOCKERHUB_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
      PUBLIC_REGISTRY_IMAGE: ${{ needs.prepare.outputs.PUBLIC_REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          allow-unsafe-pr-checkout: true # Needed to be able to pull for Fork PRs
          submodules: false
      - uses: ./.github/actions/checkout-and-login
        with:
          ref: ${{ inputs.ref || github.sha }}
          registry: ${{ secrets.cache_registry || vars.CI_REGISTRY_IMAGE }}
          username: ${{ secrets.cache_user }}
          password: ${{ secrets.cache_password }}
      - run: BUILD_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" addons/docker-build/deploydocker.sh
        env:
          PUSH_BUILD_IMAGES: "1"
          USEPODMAN: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-artifacts
          path: artifacts/
          if-no-files-found: ignore
      - name: Deploy test scripts used by GitLab CI
        env:
          WHBUILD_BUILDBOTPASSWORD: ${{ secrets.WHBUILD_BUILDBOTPASSWORD }}
        # only default branch should deploy test scripts
        if: github.ref == 'refs/heads/main' && !inputs.scheduled && env.WHBUILD_BUILDBOTPASSWORD != ''
        run: addons/deploy_testscripts.sh
